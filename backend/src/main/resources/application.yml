spring:
  application:
    name: zoopass-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zoopass}
    username: ${DB_USERNAME:zoopass}
    password: ${DB_PASSWORD:zoopass}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: Asia/Ho_Chi_Minh
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}
  error:
    # Our GlobalExceptionHandler builds every error body; never leak stack traces.
    include-stacktrace: never
    include-message: never

app:
  # Comma-separated list of frontend origins allowed by CORS.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # When true, error responses include the exception detail (dev only).
  errors:
    include-debug-detail: false
  # Links in emails point to the React app.
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:ZooPass <no-reply@zoopass.test>}
  security:
    # Required in production: at least 32 random characters. dev/test profiles set their own value.
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    verification-token-ttl: 24h
    password-reset-token-ttl: 30m
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    # Lax works when frontend and API share a site (localhost). Use None (+ secure) across domains.
    refresh-cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
    bcrypt-strength: 10
    login-max-failures: 5
    login-lock-duration: 15m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  file:
    name: ${LOG_FILE:logs/zoopass.log}
