spring:
  jpa:
    show-sql: false

app:
  errors:
    include-debug-detail: true
  security:
    # Development only - production must set JWT_SECRET.
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.zoopass: DEBUG
    org.hibernate.SQL: DEBUG
